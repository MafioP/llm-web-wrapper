services:
  llm-web-wrapper:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HEADLESS=false
      - DISPLAY=:99
      - POOL_SIZE=3
    volumes:
      - ./profiles:/app/profiles
      - /tmp/.X11-unix:/tmp/.X11-unix
    entrypoint: sh -c "rm -f /app/profiles/*/Singleton* && node src/server.js"
    restart: unless-stopped
    shm_size: 1gb
